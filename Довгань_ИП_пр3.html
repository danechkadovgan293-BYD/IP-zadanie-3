<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid верстка</title>
    <style>
        body {
            background-color: #c3e2e6;
            display: flex;
            justify-content: center;
            padding: 50px 0;
        }

        header {
            display: grid;
            grid-auto-columns: 150px 1fr 150px;
            grid-template-rows: 80px 50px;
            gap: 15px 25px;
            max-width: 1000px;
            width: 100%;
        }

        .logo {
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 2;
            background-color: #2ecc71;
            border-radius: 6px;
        }

        .search {
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 2;
            grid-column-end: 3;
            display: flex;
        }

        .login {
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 3;
            grid-column-end: 4;
            background-color: #2ecc71;
            border-radius: 6px;
        }

        .options {
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 2;
            grid-column-end: 3;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 1fr;
            gap: 15px;
        }

        .search__input {
            flex: 1;
            border: none;
            padding: 0 20px;
            font-size: 18px;
            outline: none;
            color: #333;
        }

        .search__button {
            background-color: #e84393;
            color: #ffffff;
            border: none;
            padding: 0 30px;
            font-size: 16px;
            font-weight: 500;
        }

        .search__button:hover {
            background-color: #c72c76;
        }

        .opions__button {
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
        }

        .opions__button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
    <div class="logo"></div>
    <form class="search">
    <input class="search__input" type="text" placeholder="Поиск">
    <button class="search__button" type="submit">Найти</button>
    </form>
    <div class="options">
    <button class="opions__button">1</button>
    <button class="opions__button">2</button>
    <button class="opions__button">3</button>
    <button class="opions__button">4</button>
    </div>
    <div class="login"></div>
    </header>
</body>
</html>
